name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Paquets portables (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: apt-get update && apt-get install -y --no-install-recommends curl unzip gzip

      # GRDB utilise sqlite3_snapshot_*, absent de la libsqlite3 d'Ubuntu.
      # La SQLite d'Apple l'active : ce contournement ne concerne que la CI Linux.
      - name: SQLite avec SQLITE_ENABLE_SNAPSHOT
        run: ./Scripts/build-sqlite-linux.sh

      # UHFCore et UHFSources ne dépendent que de Foundation ; UHFStore et UHFSync
      # ajoutent SQLite. Tous quatre se testent sur Linux, ce qui couvre l'essentiel
      # de la logique métier avec une CI rapide et gratuite. UHFPlayback
      # (AVFoundation) et les cibles d'app relèvent du job macOS.
      - name: Tests
        run: ./Scripts/test-all.sh

      - name: Performance (release)
        run: |
          export LD_LIBRARY_PATH=/opt/sqlite/lib:$LD_LIBRARY_PATH
          swift test -c release --package-path Packages/UHFSources --filter PerformanceTests
          swift test -c release --package-path Packages/UHFStore \
            -Xlinker -L/opt/sqlite/lib --filter StorePerformanceTests

  apple:
    name: Paquets Apple (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilation de tous les paquets
        run: |
          for package in UHFCore UHFSources UHFStore UHFSync UHFViewModels UHFPlayback; do
            echo "════ $package"
            swift build --package-path "Packages/$package"
          done
      - name: Tests
        run: |
          for package in UHFCore UHFSources UHFStore UHFSync UHFViewModels; do
            swift test --package-path "Packages/$package"
          done
      # À compléter quand les cibles d'app existeront :
      # xcodebuild -scheme UHF-iOS  -destination 'platform=iOS Simulator,name=iPhone 16'
      # xcodebuild -scheme UHF-tvOS -destination 'platform=tvOS Simulator,name=Apple TV 4K'
